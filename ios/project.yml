name: MathBlitz
options:
  bundleIdPrefix: com.dellajax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  MathBlitzCore:
    path: MathBlitzCore

targets:
  MathBlitz:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MathBlitzCore
        product: MathBlitzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dellajax.mathblitz
        PRODUCT_NAME: Math Blitz
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO

  MathBlitzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MathBlitz

schemes:
  MathBlitz:
    build:
      targets:
        MathBlitz: all
        MathBlitzUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MathBlitzUITests
    run:
      config: Debug
    archive:
      config: Release
